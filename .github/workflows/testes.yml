# Roda os testes no Windows a cada envio. Sem Office na máquina do GitHub: os testes "office" são pulados.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -m "not office"
